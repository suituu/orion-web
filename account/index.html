<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>用户中心 - ORION</title>

<link rel="stylesheet" href="/assets/css/account.css">
</head>

<body>

<header class="nav">
    <a class="logo" href="/">ORION</a>

    <nav class="nav-links">
        <a href="/products/">产品</a>
        <a href="/software/">软件</a>
        <a href="/buy/">购买</a>
        <button
            id="logoutButton"
            class="logout-button"
            type="button"
            hidden
        >
            退出登录
        </button>
    </nav>
</header>

<main class="page">
    <div class="page-header">
        <h1>用户中心</h1>
        <p>管理你的 ORION 订单、授权与设备</p>
    </div>

    <section id="loginPanel" class="panel login-panel">
        <h2>登录账户</h2>
        <p>使用购买 ORION 产品时创建的账户登录。</p>

        <form id="loginForm">
            <div class="field">
                <label for="username">用户名</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">密码</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                id="loginButton"
                class="primary-button"
                type="submit"
            >
                登录
            </button>

            <div
                id="loginMessage"
                class="message"
                aria-live="polite"
            ></div>
        </form>
    </section>

    <div id="loadingPanel" class="panel loading" hidden>
        正在加载账户信息……
    </div>

    <section id="dashboard" class="dashboard">
        <div class="panel profile-card">
            <div class="profile-top">
                <div>
                    <h2 id="profileName" class="profile-name">—</h2>
                    <p id="profileEmail" class="profile-email">—</p>
                </div>

                <div id="profileCreated" class="profile-created"></div>
            </div>

            <div class="stats">
                <div class="stat">
                    <div id="orderCount" class="stat-value">0</div>
                    <div class="stat-label">订单</div>
                </div>

                <div class="stat">
                    <div id="paymentCount" class="stat-value">0</div>
                    <div class="stat-label">支付</div>
                </div>

                <div class="stat">
                    <div id="licenseCount" class="stat-value">0</div>
                    <div class="stat-label">License</div>
                </div>

                <div class="stat">
                    <div id="deviceCount" class="stat-value">0</div>
                    <div class="stat-label">设备</div>
                </div>
            </div>
        </div>
        <section class="section">
            <div class="section-heading">
                <h2>账户安全</h2>
            </div>

            <div class="panel password-card">
                <p class="password-description">
                    修改密码后，当前浏览器将退出登录，请使用新密码重新登录。
                </p>

                <form id="passwordForm" class="password-form">
                    <div class="field">
                        <label for="currentPassword">当前密码</label>
                        <input
                            id="currentPassword"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="newPassword">新密码</label>
                        <input
                            id="newPassword"
                            type="password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="128"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="confirmPassword">确认新密码</label>
                        <input
                            id="confirmPassword"
                            type="password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="128"
                            required
                        >
                    </div>

                    <button
                        id="passwordButton"
                        class="primary-button"
                        type="submit"
                    >
                        修改密码
                    </button>

                    <div
                        id="passwordMessage"
                        class="message password-message"
                        aria-live="polite"
                    ></div>
                </form>
            </div>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>我的订单</h2>
                <span id="orderSectionCount" class="section-count"></span>
            </div>

            <div id="orderList" class="cards"></div>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>我的 License</h2>
                <span id="licenseSectionCount" class="section-count"></span>
            </div>

            <div id="licenseList" class="cards"></div>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>我的设备</h2>
                <span id="deviceSectionCount" class="section-count"></span>
            </div>

            <div id="deviceList" class="cards"></div>
        </section>
    </section>
</main>

<footer class="footer">
    ORION 智能设备运营系统
</footer>

<script src="/assets/js/account.js"></script>

</body>
</html>
