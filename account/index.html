<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>用户中心 - ORION</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    color: #1d1d1f;
    background: #f5f5f7;
}

button,
input {
    font: inherit;
}

.nav {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 10%;
    background: rgba(255, 255, 255, 0.82);
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    backdrop-filter: blur(20px);
}

.logo {
    color: #1d1d1f;
    font-size: 24px;
    font-weight: 700;
    text-decoration: none;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 26px;
}

.nav-links a,
.logout-button {
    margin: 0;
    padding: 0;
    border: 0;
    color: #333;
    background: transparent;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
}

.logout-button:hover,
.nav-links a:hover {
    color: #0071e3;
}

.page {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
    padding: 70px 0 100px;
}

.page-header {
    margin-bottom: 38px;
    text-align: center;
}

.page-header h1 {
    margin: 0;
    font-size: clamp(42px, 7vw, 72px);
    letter-spacing: -3px;
}

.page-header p {
    margin: 16px 0 0;
    color: #6e6e73;
    font-size: 18px;
}

.panel {
    background: #fff;
    border: 1px solid #e5e5e7;
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.05);
}

.login-panel {
    width: min(460px, 100%);
    margin: 0 auto;
    padding: 42px;
}

.login-panel h2 {
    margin: 0 0 8px;
    font-size: 30px;
}

.login-panel > p {
    margin: 0 0 30px;
    color: #6e6e73;
    line-height: 1.7;
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
}

.field input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d2d2d7;
    border-radius: 14px;
    outline: none;
    background: #fff;
    color: #1d1d1f;
}

.field input:focus {
    border-color: #0071e3;
    box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12);
}

.primary-button {
    width: 100%;
    margin-top: 8px;
    padding: 14px 20px;
    border: 0;
    border-radius: 999px;
    background: #111;
    color: #fff;
    cursor: pointer;
}

.primary-button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
}

.message {
    min-height: 22px;
    margin-top: 18px;
    color: #d70015;
    font-size: 14px;
    text-align: center;
}

.loading {
    padding: 70px 20px;
    color: #6e6e73;
    text-align: center;
}

.dashboard {
    display: none;
}

.profile-card {
    padding: 34px;
}

.profile-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: flex-start;
}

.profile-name {
    margin: 0;
    font-size: 32px;
}

.profile-email {
    margin: 8px 0 0;
    color: #6e6e73;
}

.profile-created {
    color: #6e6e73;
    font-size: 14px;
    text-align: right;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 30px;
}

.stat {
    padding: 22px;
    border-radius: 20px;
    background: #f5f5f7;
}

.stat-value {
    font-size: 30px;
    font-weight: 700;
}

.stat-label {
    margin-top: 6px;
    color: #6e6e73;
    font-size: 14px;
}

.section {
    margin-top: 34px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 16px;
}

.section-heading h2 {
    margin: 0;
    font-size: 30px;
}

.section-count {
    color: #6e6e73;
    font-size: 14px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.item-card {
    padding: 26px;
}

.item-title-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
}

.item-title {
    margin: 0;
    font-size: 20px;
}

.status {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}

.status-active,
.status-online {
    color: #137333;
    background: #e6f4ea;
}

.status-unused,
.status-inactive {
    color: #8a5a00;
    background: #fff4ce;
}

.status-revoked,
.status-offline {
    color: #b3261e;
    background: #fce8e6;
}

.status-default {
    color: #515154;
    background: #eeeeef;
}

.details {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr);
    gap: 12px;
    margin-top: 24px;
    font-size: 14px;
}

.detail-label {
    color: #6e6e73;
}

.detail-value {
    min-width: 0;
    overflow-wrap: anywhere;
    font-weight: 500;
}

.license-key {
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
}

.empty-state {
    grid-column: 1 / -1;
    padding: 48px 20px;
    border: 1px dashed #d2d2d7;
    border-radius: 24px;
    color: #6e6e73;
    text-align: center;
}

.footer {
    padding: 40px 20px;
    color: #86868b;
    font-size: 13px;
    text-align: center;
}

@media (max-width: 820px) {
    .nav {
        padding: 16px 20px;
    }

    .nav-links a:not(:last-child) {
        display: none;
    }

    .page {
        width: min(100% - 28px, 1180px);
        padding-top: 48px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .cards {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 540px) {
    .login-panel,
    .profile-card,
    .item-card {
        padding: 24px;
    }

    .profile-top {
        display: block;
    }

    .profile-created {
        margin-top: 16px;
        text-align: left;
    }

    .details {
        grid-template-columns: 1fr;
        gap: 5px;
    }

    .detail-value {
        margin-bottom: 10px;
    }
}
</style>
</head>

<body>

<header class="nav">
    <a class="logo" href="/">ORION</a>

    <nav class="nav-links">
        <a href="/products/">产品</a>
        <a href="/software/">软件</a>
        <a href="/buy/">购买</a>
        <button
            id="logoutButton"
            class="logout-button"
            type="button"
            hidden
        >
            退出登录
        </button>
    </nav>
</header>

<main class="page">
    <div class="page-header">
        <h1>用户中心</h1>
        <p>管理你的 ORION 授权与设备</p>
    </div>

    <section id="loginPanel" class="panel login-panel">
        <h2>登录账户</h2>
        <p>使用购买 ORION 产品时创建的账户登录。</p>

        <form id="loginForm">
            <div class="field">
                <label for="username">用户名</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">密码</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                id="loginButton"
                class="primary-button"
                type="submit"
            >
                登录
            </button>

            <div
                id="loginMessage"
                class="message"
                aria-live="polite"
            ></div>
        </form>
    </section>

    <div id="loadingPanel" class="panel loading" hidden>
        正在加载账户信息……
    </div>

    <section id="dashboard" class="dashboard">
        <div class="panel profile-card">
            <div class="profile-top">
                <div>
                    <h2 id="profileName" class="profile-name">—</h2>
                    <p id="profileEmail" class="profile-email">—</p>
                </div>

                <div id="profileCreated" class="profile-created"></div>
            </div>

            <div class="stats">
                <div class="stat">
                    <div id="orderCount" class="stat-value">0</div>
                    <div class="stat-label">订单</div>
                </div>

                <div class="stat">
                    <div id="paymentCount" class="stat-value">0</div>
                    <div class="stat-label">支付</div>
                </div>

                <div class="stat">
                    <div id="licenseCount" class="stat-value">0</div>
                    <div class="stat-label">License</div>
                </div>

                <div class="stat">
                    <div id="deviceCount" class="stat-value">0</div>
                    <div class="stat-label">设备</div>
                </div>
            </div>
        </div>

        <section class="section">
            <div class="section-heading">
                <h2>我的 License</h2>
                <span id="licenseSectionCount" class="section-count"></span>
            </div>

            <div id="licenseList" class="cards"></div>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>我的设备</h2>
                <span id="deviceSectionCount" class="section-count"></span>
            </div>

            <div id="deviceList" class="cards"></div>
        </section>
    </section>
</main>

<footer class="footer">
    ORION 智能设备运营系统
</footer>

<script>
const TOKEN_KEY = "orion_token";

const loginPanel = document.getElementById("loginPanel");
const loadingPanel = document.getElementById("loadingPanel");
const dashboard = document.getElementById("dashboard");
const logoutButton = document.getElementById("logoutButton");
const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const loginMessage = document.getElementById("loginMessage");

function getToken() {
    return localStorage.getItem(TOKEN_KEY);
}

function saveToken(token) {
    localStorage.setItem(TOKEN_KEY, token);
}

function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
}

function showLogin(message = "") {
    loginPanel.hidden = false;
    loadingPanel.hidden = true;
    dashboard.style.display = "none";
    logoutButton.hidden = true;
    loginMessage.textContent = message;
}

function showLoading() {
    loginPanel.hidden = true;
    loadingPanel.hidden = false;
    dashboard.style.display = "none";
    logoutButton.hidden = true;
}

function showDashboard() {
    loginPanel.hidden = true;
    loadingPanel.hidden = true;
    dashboard.style.display = "block";
    logoutButton.hidden = false;
}

async function requestApi(path, options = {}) {
    const headers = {
        ...(options.headers || {})
    };

    const token = getToken();

    if (token) {
        headers.Authorization = `Bearer ${token}`;
    }

    const response = await fetch(path, {
        ...options,
        headers
    });

    let data;

    try {
        data = await response.json();
    } catch (error) {
        throw new Error("服务器返回了无效数据");
    }

    if (response.status === 401) {
        clearToken();
        throw new Error("登录已失效，请重新登录");
    }

    if (!response.ok || data.success === false) {
        throw new Error(
            data.message ||
            data.error ||
            "请求失败"
        );
    }

    return data;
}

function formatDate(value) {
    if (!value) {
        return "—";
    }

    const normalized = value.includes("T")
        ? value
        : value.replace(" ", "T") + "Z";

    const date = new Date(normalized);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    }).format(date);
}

function createStatus(status) {
    const element = document.createElement("span");
    const normalized = String(status || "unknown").toLowerCase();

    element.className = "status";

    if (["active", "online"].includes(normalized)) {
        element.classList.add(`status-${normalized}`);
    } else if (["unused", "inactive"].includes(normalized)) {
        element.classList.add(`status-${normalized}`);
    } else if (["revoked", "offline"].includes(normalized)) {
        element.classList.add(`status-${normalized}`);
    } else {
        element.classList.add("status-default");
    }

    element.textContent = status || "unknown";

    return element;
}

function appendDetail(container, label, value, className = "") {
    const labelElement = document.createElement("div");
    labelElement.className = "detail-label";
    labelElement.textContent = label;

    const valueElement = document.createElement("div");
    valueElement.className = `detail-value ${className}`.trim();
    valueElement.textContent =
        value === null ||
        value === undefined ||
        value === ""
            ? "—"
            : String(value);

    container.append(labelElement, valueElement);
}

function renderProfile(profile) {
    document.getElementById("profileName").textContent =
        profile.username || "ORION 用户";

    document.getElementById("profileEmail").textContent =
        profile.email || "未设置邮箱";

    document.getElementById("profileCreated").textContent =
        `注册时间：${formatDate(profile.created_at)}`;

    document.getElementById("orderCount").textContent =
        profile.orders ?? 0;

    document.getElementById("paymentCount").textContent =
        profile.payments ?? 0;

    document.getElementById("licenseCount").textContent =
        profile.licenses ?? 0;

    document.getElementById("deviceCount").textContent =
        profile.devices ?? 0;
}

function renderLicenses(licenses) {
    const list = document.getElementById("licenseList");

    list.replaceChildren();

    document.getElementById("licenseSectionCount").textContent =
        `共 ${licenses.length} 个`;

    if (licenses.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "当前账户暂无 License";
        list.appendChild(empty);
        return;
    }

    for (const license of licenses) {
        const card = document.createElement("article");
        card.className = "panel item-card";

        const titleRow = document.createElement("div");
        titleRow.className = "item-title-row";

        const title = document.createElement("h3");
        title.className = "item-title";
        title.textContent = license.product || "ORION License";

        titleRow.append(title, createStatus(license.status));

        const details = document.createElement("div");
        details.className = "details";

        appendDetail(
            details,
            "License Key",
            license.license_key,
            "license-key"
        );
        appendDetail(details, "设备编号", license.device_id);
        appendDetail(details, "激活次数", license.activated_count ?? 0);
        appendDetail(details, "激活时间", formatDate(license.activated_at));
        appendDetail(details, "到期时间", formatDate(license.expires_at));
        appendDetail(details, "创建时间", formatDate(license.created_at));

        card.append(titleRow, details);
        list.appendChild(card);
    }
}

function renderDevices(devices) {
    const list = document.getElementById("deviceList");

    list.replaceChildren();

    document.getElementById("deviceSectionCount").textContent =
        `共 ${devices.length} 台`;

    if (devices.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "当前账户暂无已绑定设备";
        list.appendChild(empty);
        return;
    }

    for (const device of devices) {
        const card = document.createElement("article");
        card.className = "panel item-card";

        const titleRow = document.createElement("div");
        titleRow.className = "item-title-row";

        const title = document.createElement("h3");
        title.className = "item-title";
        title.textContent = device.device_id || "ORION Device";

        titleRow.append(title, createStatus(device.status));

        const details = document.createElement("div");
        details.className = "details";

        appendDetail(details, "设备型号", device.model);
        appendDetail(details, "授权产品", device.product);
        appendDetail(details, "固件版本", device.firmware_version);
        appendDetail(details, "硬件版本", device.hardware_version);
        appendDetail(details, "序列号", device.serial_number);
        appendDetail(details, "MAC 地址", device.mac_address);
        appendDetail(details, "License 状态", device.license_status);
        appendDetail(details, "最后在线", formatDate(device.last_seen));

        card.append(titleRow, details);
        list.appendChild(card);
    }
}

async function loadAccount() {
    if (!getToken()) {
        showLogin();
        return;
    }

    showLoading();

    try {
        const [
            profileResponse,
            licensesResponse,
            devicesResponse
        ] = await Promise.all([
            requestApi("/api/account/profile"),
            requestApi("/api/account/licenses"),
            requestApi("/api/account/devices")
        ]);

        renderProfile(profileResponse.data);
        renderLicenses(licensesResponse.data || []);
        renderDevices(devicesResponse.data || []);

        showDashboard();
    } catch (error) {
        showLogin(error.message);
    }
}

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    loginMessage.textContent = "";
    loginButton.disabled = true;
    loginButton.textContent = "正在登录……";

    const username = document
        .getElementById("username")
        .value
        .trim();

    const password = document
        .getElementById("password")
        .value;

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success || !data.token) {
            throw new Error(
                data.error ||
                data.message ||
                "用户名或密码错误"
            );
        }

        saveToken(data.token);
        loginForm.reset();

        await loadAccount();
    } catch (error) {
        loginMessage.textContent = error.message;
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "登录";
    }
});

logoutButton.addEventListener("click", () => {
    clearToken();
    loginForm.reset();
    showLogin("已退出登录");
});

loadAccount();
</script>

</body>
</html>
