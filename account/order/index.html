<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>订单详情 - ORION</title>

<link rel="stylesheet" href="/assets/css/account-order.css">
</head>

<body>

<header class="nav">
    <a class="logo" href="/">ORION</a>

    <nav class="nav-links">
        <a href="/account/">用户中心</a>
        <a href="/products/">产品</a>
        <a href="/buy/">购买</a>
    </nav>
</header>

<main class="page">
    <a class="back-link" href="/account/">
        ← 返回用户中心
    </a>

    <div class="page-header">
        <div class="page-header-row">
            <div>
                <h1 id="pageTitle">订单详情</h1>
                <p id="pageSubtitle">正在读取订单信息……</p>
            </div>

            <div id="orderStatus"></div>
        </div>
    </div>

    <div id="loadingPanel" class="panel loading">
        正在加载订单详情……
    </div>

    <section id="errorPanel" class="panel error-panel" hidden>
        <h2>无法显示订单</h2>
        <p id="errorMessage">订单信息加载失败。</p>

        <a
            id="errorAction"
            class="error-action"
            href="/account/"
        >
            返回用户中心
        </a>
    </section>

    <div id="orderContent" hidden>
        <section class="section">
            <div class="section-heading">
                <h2>订单信息</h2>
            </div>

            <div class="panel detail-panel">
                <div id="orderDetails" class="details"></div>
            </div>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>支付信息</h2>
            </div>

            <div id="paymentContent"></div>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>License</h2>
                <span
                    id="licenseCount"
                    class="section-count"
                ></span>
            </div>

            <div id="licenseList" class="cards"></div>
        </section>
    </div>
</main>

<footer class="footer">
    ORION 智能设备运营系统
</footer>

<script src="/assets/js/account-order.js"></script>

</body>
</html>
