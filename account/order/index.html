<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>订单详情 - ORION</title>

<style>
* {
    box-sizing: border-box;
}

[hidden] {
    display: none !important;
}

body {
    margin: 0;
    background: #fff;
    color: #1d1d1f;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

a {
    color: inherit;
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    padding: 18px 8%;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(20px);
}

.logo {
    color: #1d1d1f;
    font-size: 24px;
    font-weight: 700;
    text-decoration: none;
}

.nav-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 24px;
}

.nav-links a {
    color: #333;
    font-size: 14px;
    text-decoration: none;
}

.nav-links a:hover {
    color: #0071e3;
}

.page {
    width: min(100% - 40px, 1080px);
    min-height: calc(100vh - 150px);
    margin: 0 auto;
    padding: 64px 0;
}

.back-link {
    display: inline-block;
    margin-bottom: 28px;
    color: #0071e3;
    font-size: 14px;
    text-decoration: none;
}

.back-link:hover {
    text-decoration: underline;
}

.page-header {
    margin-bottom: 32px;
}

.page-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
}

.page-header h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 54px);
    letter-spacing: -0.03em;
}

.page-header p {
    margin: 12px 0 0;
    color: #6e6e73;
}

.panel {
    border: 1px solid #e5e5e7;
    border-radius: 26px;
    background: #fff;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
}

.loading,
.error-panel {
    padding: 48px 24px;
    color: #6e6e73;
    text-align: center;
}

.error-panel h2 {
    margin: 0 0 12px;
    color: #1d1d1f;
}

.error-panel p {
    margin: 0;
}

.error-action {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 22px;
    border-radius: 999px;
    background: #1d1d1f;
    color: #fff;
    text-decoration: none;
}

.section {
    margin-top: 30px;
}

.section:first-child {
    margin-top: 0;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 16px;
}

.section-heading h2 {
    margin: 0;
    font-size: 28px;
}

.section-count {
    color: #6e6e73;
    font-size: 14px;
}

.detail-panel {
    padding: 30px;
}

.details {
    display: grid;
    grid-template-columns: 150px minmax(0, 1fr);
    gap: 14px 20px;
    font-size: 14px;
}

.detail-label {
    color: #6e6e73;
}

.detail-value {
    min-width: 0;
    overflow-wrap: anywhere;
    font-weight: 500;
}

.status {
    display: inline-block;
    flex: 0 0 auto;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}

.status-active,
.status-online,
.status-paid {
    color: #137333;
    background: #e6f4ea;
}

.status-unused,
.status-inactive,
.status-created,
.status-pending {
    color: #8a5a00;
    background: #fff4ce;
}

.status-revoked,
.status-offline,
.status-failed,
.status-cancelled,
.status-canceled,
.status-refunded {
    color: #b3261e;
    background: #fce8e6;
}

.status-default {
    color: #515154;
    background: #eeeeef;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.item-card {
    padding: 26px;
}

.item-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
}

.item-title {
    margin: 0;
    font-size: 19px;
}

.item-card .details {
    grid-template-columns: 125px minmax(0, 1fr);
    margin-top: 24px;
}

.empty-state {
    grid-column: 1 / -1;
    padding: 44px 20px;
    border: 1px dashed #d2d2d7;
    border-radius: 24px;
    color: #6e6e73;
    text-align: center;
}

.license-key {
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
}

.license-key-control {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.license-key-text {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
}

.license-key-actions {
    display: flex;
    flex: 0 0 auto;
    gap: 8px;
}

.license-key-button {
    padding: 5px 11px;
    border: 1px solid #d2d2d7;
    border-radius: 999px;
    background: #fff;
    color: #1d1d1f;
    font-size: 12px;
    cursor: pointer;
}

.license-key-button:hover {
    border-color: #86868b;
    background: #f5f5f7;
}

.license-key-button:disabled {
    cursor: default;
    opacity: 0.7;
}

.footer {
    padding: 38px 20px;
    color: #86868b;
    font-size: 13px;
    text-align: center;
}

@media (max-width: 760px) {
    .nav {
        padding: 16px 20px;
    }

    .nav-links {
        gap: 14px;
    }

    .nav-links a:nth-child(2),
    .nav-links a:nth-child(3) {
        display: none;
    }

    .page {
        width: min(100% - 28px, 1080px);
        padding-top: 44px;
    }

    .page-header-row {
        display: block;
    }

    #orderStatus {
        margin-top: 18px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .detail-panel,
    .item-card {
        padding: 24px;
    }

    .details,
    .item-card .details {
        grid-template-columns: 1fr;
        gap: 5px;
    }

    .detail-value {
        margin-bottom: 10px;
    }
}
</style>
</head>

<body>

<header class="nav">
    <a class="logo" href="/">ORION</a>

    <nav class="nav-links">
        <a href="/account/">用户中心</a>
        <a href="/products/">产品</a>
        <a href="/buy/">购买</a>
    </nav>
</header>

<main class="page">
    <a class="back-link" href="/account/">
        ← 返回用户中心
    </a>

    <div class="page-header">
        <div class="page-header-row">
            <div>
                <h1 id="pageTitle">订单详情</h1>
                <p id="pageSubtitle">正在读取订单信息……</p>
            </div>

            <div id="orderStatus"></div>
        </div>
    </div>

    <div id="loadingPanel" class="panel loading">
        正在加载订单详情……
    </div>

    <section id="errorPanel" class="panel error-panel" hidden>
        <h2>无法显示订单</h2>
        <p id="errorMessage">订单信息加载失败。</p>

        <a
            id="errorAction"
            class="error-action"
            href="/account/"
        >
            返回用户中心
        </a>
    </section>

    <div id="orderContent" hidden>
        <section class="section">
            <div class="section-heading">
                <h2>订单信息</h2>
            </div>

            <div class="panel detail-panel">
                <div id="orderDetails" class="details"></div>
            </div>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>支付信息</h2>
            </div>

            <div id="paymentContent"></div>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>License</h2>
                <span
                    id="licenseCount"
                    class="section-count"
                ></span>
            </div>

            <div id="licenseList" class="cards"></div>
        </section>
    </div>
</main>

<footer class="footer">
    ORION 智能设备运营系统
</footer>

<script>
const TOKEN_KEY = "orion_token";

const loadingPanel =
    document.getElementById("loadingPanel");

const errorPanel =
    document.getElementById("errorPanel");

const errorMessage =
    document.getElementById("errorMessage");

const errorAction =
    document.getElementById("errorAction");

const orderContent =
    document.getElementById("orderContent");

function getToken() {
    return localStorage.getItem(TOKEN_KEY);
}

function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
}

async function requestApi(path) {
    const token = getToken();

    const response = await fetch(path, {
        headers: token
            ? {
                Authorization: `Bearer ${token}`
            }
            : {}
    });

    let data;

    try {
        data = await response.json();
    } catch (error) {
        throw new Error("服务器返回了无效数据");
    }

    if (response.status === 401) {
        clearToken();
        throw new Error("登录已失效，请重新登录");
    }

    if (!response.ok || data.success === false) {
        throw new Error(
            data.message ||
            data.error ||
            "请求失败"
        );
    }

    return data;
}

function formatDate(value) {
    if (!value) {
        return "—";
    }

    const text = String(value);

    const normalized = text.includes("T")
        ? text
        : text.replace(" ", "T") + "Z";

    const date = new Date(normalized);

    if (Number.isNaN(date.getTime())) {
        return text;
    }

    return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    }).format(date);
}

function formatMoney(value, currency = "CNY") {
    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    const amount = Number(value);

    if (!Number.isFinite(amount)) {
        return String(value);
    }

    try {
        return new Intl.NumberFormat("zh-CN", {
            style: "currency",
            currency: String(currency || "CNY")
        }).format(amount);
    } catch (error) {
        return `¥${amount.toFixed(2)}`;
    }
}

function createStatus(status) {
    const element = document.createElement("span");
    const normalized =
        String(status || "unknown").toLowerCase();

    element.className = "status";

    if (
        ["active", "online", "paid"].includes(normalized)
    ) {
        element.classList.add(`status-${normalized}`);
    } else if (
        [
            "unused",
            "inactive",
            "created",
            "pending"
        ].includes(normalized)
    ) {
        element.classList.add(`status-${normalized}`);
    } else if (
        [
            "revoked",
            "offline",
            "failed",
            "cancelled",
            "canceled",
            "refunded"
        ].includes(normalized)
    ) {
        element.classList.add(`status-${normalized}`);
    } else {
        element.classList.add("status-default");
    }

    element.textContent = status || "unknown";

    return element;
}

function appendDetail(container, label, value, className = "") {
    const labelElement = document.createElement("div");
    labelElement.className = "detail-label";
    labelElement.textContent = label;

    const valueElement = document.createElement("div");
    valueElement.className =
        `detail-value ${className}`.trim();

    valueElement.textContent =
        value === null ||
        value === undefined ||
        value === ""
            ? "—"
            : String(value);

    container.append(labelElement, valueElement);
}

function maskLicenseKey(value) {
    const key = String(value || "");

    if (!key) {
        return "—";
    }

    const parts = key.split("-");

    if (parts.length >= 4) {
        return parts
            .map((part, index) => {
                if (
                    index >= 2 &&
                    index < parts.length - 1
                ) {
                    return "•".repeat(
                        Math.max(part.length, 4)
                    );
                }

                return part;
            })
            .join("-");
    }

    if (key.length <= 8) {
        return "•".repeat(key.length);
    }

    return (
        key.slice(0, 4) +
        "•".repeat(Math.max(key.length - 8, 4)) +
        key.slice(-4)
    );
}

function copyText(value) {
    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {
        return navigator.clipboard.writeText(value);
    }

    const textArea = document.createElement("textarea");

    textArea.value = value;
    textArea.setAttribute("readonly", "");
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";

    document.body.appendChild(textArea);
    textArea.select();

    const copied =
        document.execCommand("copy");

    textArea.remove();

    if (!copied) {
        return Promise.reject(
            new Error("Copy failed")
        );
    }

    return Promise.resolve();
}

function appendLicenseKeyDetail(container, value) {
    const labelElement = document.createElement("div");
    labelElement.className = "detail-label";
    labelElement.textContent = "License Key";

    const valueElement = document.createElement("div");
    valueElement.className =
        "detail-value license-key-control";

    const fullKey =
        value === null ||
        value === undefined ||
        value === ""
            ? ""
            : String(value);

    if (!fullKey) {
        valueElement.textContent = "—";
        container.append(labelElement, valueElement);
        return;
    }

    const maskedKey = maskLicenseKey(fullKey);

    const keyText = document.createElement("span");
    keyText.className =
        "license-key license-key-text";
    keyText.textContent = maskedKey;

    const actions = document.createElement("span");
    actions.className = "license-key-actions";

    const toggleButton =
        document.createElement("button");

    toggleButton.type = "button";
    toggleButton.className = "license-key-button";
    toggleButton.textContent = "显示";
    toggleButton.setAttribute(
        "aria-pressed",
        "false"
    );

    let revealed = false;

    toggleButton.addEventListener("click", () => {
        revealed = !revealed;

        keyText.textContent = revealed
            ? fullKey
            : maskedKey;

        toggleButton.textContent = revealed
            ? "隐藏"
            : "显示";

        toggleButton.setAttribute(
            "aria-pressed",
            String(revealed)
        );
    });

    const copyButton =
        document.createElement("button");

    copyButton.type = "button";
    copyButton.className = "license-key-button";
    copyButton.textContent = "复制";

    copyButton.addEventListener(
        "click",
        async () => {
            copyButton.disabled = true;

            try {
                await copyText(fullKey);
                copyButton.textContent = "已复制";
            } catch (error) {
                copyButton.textContent = "复制失败";
            }

            window.setTimeout(() => {
                copyButton.textContent = "复制";
                copyButton.disabled = false;
            }, 1500);
        }
    );

    actions.append(toggleButton, copyButton);
    valueElement.append(keyText, actions);
    container.append(labelElement, valueElement);
}

function renderOrder(data) {
    const order = data.order;
    const payment = data.payment;
    const licenses = Array.isArray(data.licenses)
        ? data.licenses
        : [];

    document.title =
        `${order.order_no || "订单详情"} - ORION`;

    document.getElementById("pageTitle").textContent =
        order.product || "订单详情";

    document.getElementById("pageSubtitle").textContent =
        order.order_no
            ? `订单号：${order.order_no}`
            : "ORION 订单详情";

    const orderStatus =
        document.getElementById("orderStatus");

    orderStatus.replaceChildren(
        createStatus(order.status)
    );

    const orderDetails =
        document.getElementById("orderDetails");

    orderDetails.replaceChildren();

    appendDetail(
        orderDetails,
        "订单号",
        order.order_no
    );

    appendDetail(
        orderDetails,
        "产品",
        order.product ||
        `产品 #${order.product_id || "—"}`
    );

    appendDetail(
        orderDetails,
        "订单金额",
        formatMoney(order.amount)
    );

    appendDetail(
        orderDetails,
        "订单状态",
        order.status
    );

    appendDetail(
        orderDetails,
        "创建时间",
        formatDate(order.created_at)
    );

    renderPayment(payment);
    renderLicenses(licenses);
}

function renderPayment(payment) {
    const container =
        document.getElementById("paymentContent");

    container.replaceChildren();

    if (!payment) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "当前订单暂无支付记录";
        container.appendChild(empty);
        return;
    }

    const panel = document.createElement("div");
    panel.className = "panel detail-panel";

    const details = document.createElement("div");
    details.className = "details";

    appendDetail(
        details,
        "支付单号",
        payment.payment_no
    );

    appendDetail(
        details,
        "支付渠道",
        payment.provider
    );

    appendDetail(
        details,
        "支付金额",
        formatMoney(
            payment.amount,
            payment.currency
        )
    );

    appendDetail(
        details,
        "支付状态",
        payment.status
    );

    appendDetail(
        details,
        "交易号",
        payment.transaction_id
    );

    appendDetail(
        details,
        "支付时间",
        formatDate(payment.paid_at)
    );

    appendDetail(
        details,
        "失败时间",
        formatDate(payment.failed_at)
    );

    appendDetail(
        details,
        "失败原因",
        payment.failure_reason
    );

    appendDetail(
        details,
        "创建时间",
        formatDate(payment.created_at)
    );

    panel.appendChild(details);
    container.appendChild(panel);
}

function renderLicenses(licenses) {
    const list =
        document.getElementById("licenseList");

    list.replaceChildren();

    document.getElementById("licenseCount").textContent =
        `共 ${licenses.length} 个`;

    if (licenses.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "当前订单暂无 License";
        list.appendChild(empty);
        return;
    }

    for (const license of licenses) {
        const card = document.createElement("article");
        card.className = "panel item-card";

        const titleRow =
            document.createElement("div");

        titleRow.className = "item-title-row";

        const title =
            document.createElement("h3");

        title.className = "item-title";
        title.textContent =
            `License #${license.id || "—"}`;

        titleRow.append(
            title,
            createStatus(license.status)
        );

        const details =
            document.createElement("div");

        details.className = "details";

        appendLicenseKeyDetail(
            details,
            license.license_key
        );

        appendDetail(
            details,
            "设备编号",
            license.device_id
        );

        appendDetail(
            details,
            "激活次数",
            `${license.activated_count ?? 0} / ` +
            `${license.activation_limit ?? 1}`
        );

        appendDetail(
            details,
            "激活时间",
            formatDate(license.activated_at)
        );

        appendDetail(
            details,
            "到期时间",
            formatDate(license.expires_at)
        );

        appendDetail(
            details,
            "撤销时间",
            formatDate(license.revoked_at)
        );

        appendDetail(
            details,
            "创建时间",
            formatDate(license.created_at)
        );

        card.append(titleRow, details);
        list.appendChild(card);
    }
}

function showError(message, loginRequired = false) {
    loadingPanel.hidden = true;
    orderContent.hidden = true;
    errorPanel.hidden = false;
    errorMessage.textContent = message;

    if (loginRequired) {
        errorAction.textContent = "重新登录";
        errorAction.href = "/account/";
    } else {
        errorAction.textContent = "返回用户中心";
        errorAction.href = "/account/";
    }
}

async function loadOrder() {
    const token = getToken();

    if (!token) {
        showError(
            "请先登录账户，再查看订单详情。",
            true
        );
        return;
    }

    const params =
        new URLSearchParams(window.location.search);

    const orderIdText =
        String(params.get("id") || "");

    const orderId = Number(orderIdText);

    if (
        !/^[1-9]\d*$/.test(orderIdText) ||
        !Number.isSafeInteger(orderId)
    ) {
        showError("订单编号无效。");
        return;
    }

    try {
        const data = await requestApi(
            `/api/orders/${orderId}`
        );

        renderOrder(data);

        loadingPanel.hidden = true;
        errorPanel.hidden = true;
        orderContent.hidden = false;
    } catch (error) {
        showError(
            error.message ||
            "订单信息加载失败。",
            String(error.message).includes("登录")
        );
    }
}

loadOrder();
</script>

</body>
</html>
