<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ORION Payment
</title>


<style>

body{

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
"Microsoft YaHei",
sans-serif;

text-align:center;

padding:80px;

color:#1d1d1f;

}


.card{

background:#f5f5f7;

padding:40px;

border-radius:25px;

max-width:500px;

margin:auto;

}


.info{

text-align:left;

line-height:2;

margin-top:30px;

}


button{

margin-top:30px;

padding:14px 35px;

border:none;

border-radius:30px;

background:#000;

color:white;

font-size:16px;

cursor:pointer;

}


.license{

font-size:22px;

font-weight:bold;

margin-top:20px;

}

</style>

</head>


<body>


<div class="card">


<h1>
ORION Payment
</h1>


<div id="content">

Loading...

</div>


</div>



<script>


const params =
new URLSearchParams(
window.location.search
);


const orderId =
params.get("id");



if(!orderId){

document.getElementById("content").innerHTML =
"No order id";

throw new Error("No order");

}



let paymentNo = "";



// 创建支付

fetch("/api/checkout/payment/create",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

order_id:Number(orderId)

})

})


.then(res=>res.json())


.then(data=>{


if(!data.success){

throw new Error(
"Payment create failed"
);

}


const payment=data.payment;


paymentNo =
payment.payment_no;



document.getElementById("content").innerHTML = `


<div class="info">


<p>
Payment No:
${payment.payment_no}
</p>


<p>
Amount:
¥${payment.amount}
</p>


<p>
Status:
${payment.status}
</p>


</div>


<button onclick="payNow()">

Complete Payment

</button>


`;



})


.catch(err=>{


document.getElementById("content").innerHTML =
"Payment Error";


});





function payNow(){


fetch("/api/checkout/payment/mock-success",
{


method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

payment_no:paymentNo

})


})


.then(res=>res.json())


.then(data=>{


if(data.success){


const result=data.result;


document.getElementById("content").innerHTML = `


<h2>
Payment Successful
</h2>


<div class="info">


<p>
Order:
${result.order_no}
</p>


<p>
Status:
${result.order_status}
</p>


</div>


<hr>


<p>
Your ORION License
</p>


<div class="license">

${result.license_key}

</div>


<br>


<a href="/">

Back Home

</a>


`;


}


});


}


</script>


</body>

</html>
