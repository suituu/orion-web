<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORION Order Complete</title>


<style>

body{

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
"Microsoft YaHei",
sans-serif;

background:#ffffff;

color:#1d1d1f;

text-align:center;

padding:80px 20px;

}


.card{

max-width:520px;

margin:auto;

background:#f5f5f7;

border-radius:28px;

padding:50px;

}


h1{

font-size:42px;

font-weight:600;

margin-bottom:15px;

}


.subtitle{

color:#666;

margin-bottom:40px;

}


.info{

text-align:left;

line-height:2;

font-size:16px;

}


.label{

color:#666;

}


.value{

font-weight:600;

}


.license{

margin-top:25px;

padding:20px;

background:#fff;

border-radius:16px;

font-family:monospace;

font-size:18px;

}


a{

display:inline-block;

margin-top:35px;

text-decoration:none;

color:#0071e3;

}


</style>

</head>


<body>


<div class="card">


<h1>
Thank You
</h1>


<div class="subtitle">
Thank you for choosing ORION
</div>



<div id="content">

Loading...

</div>


<a href="/software/">
Explore ORION Software →
</a>


</div>



<script>


const params =
new URLSearchParams(
window.location.search
);


const orderId =
String(
params.get("id") || ""
);

const orderIdNumber =
Number(orderId);


if(
!/^[1-9]\d*$/.test(orderId) ||
!Number.isSafeInteger(orderIdNumber)
){

document.getElementById("content").innerHTML =
"Invalid order id";

throw new Error("invalid id");

}


const guestAccessToken =
String(
sessionStorage.getItem(
"orion_guest_access_token_" + orderId
) || ""
).trim();


if(
!/^[a-f0-9]{64}$/.test(
guestAccessToken
)
){

document.getElementById("content").innerHTML =
"Unable to access order information";

throw new Error(
"missing guest access token"
);

}


const encodedOrderId =
encodeURIComponent(orderId);

const requestOptions = {

headers:{

"X-Guest-Access-Token":
guestAccessToken

}

};


Promise.all([

fetch(
"/api/orders/guest/" + encodedOrderId,
requestOptions
)
.then(res=>res.json()),


fetch(
"/api/public/license/order/" +
encodedOrderId,
requestOptions
)
.then(res=>res.json())

])


.then(result=>{


const orderData=result[0];

const licenseData=result[1];



if(
!orderData.success ||
!licenseData.success
){

throw new Error("query failed");

}



const order =
orderData.order;


const license =
licenseData.license;



document.getElementById("content").innerHTML = `


<div class="info">


<p>
<span class="label">
Product:
</span>

<span class="value">
${order.product_id==2?"ORION Pro":"ORION Standard"}
</span>

</p>


<p>

<span class="label">
Order:
</span>

<span class="value">
${order.order_no}
</span>

</p>


<p>

<span class="label">
Amount:
</span>

<span class="value">
¥${order.amount}
</span>

</p>



<p>

<span class="label">
Status:
</span>

<span class="value">
${order.status}
</span>

</p>


</div>



<div class="license">

${license.license_key}

</div>


`;



})

.catch(err=>{


document.getElementById("content").innerHTML =
"Unable to load order information";


console.log(err);


});


</script>


</body>

</html>
