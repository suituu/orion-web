<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORION License Center</title>


<style>

body{

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
"Microsoft YaHei",
sans-serif;

text-align:center;

padding:80px 20px;

color:#1d1d1f;

}


.card{

max-width:520px;

margin:auto;

background:#f5f5f7;

padding:45px;

border-radius:28px;

}


h1{

font-size:38px;

}


.subtitle{

color:#666;

margin-bottom:35px;

}


input{

width:90%;

padding:15px;

border-radius:20px;

border:1px solid #ccc;

font-size:16px;

}


button{

margin-top:20px;

padding:14px 45px;

border:0;

border-radius:30px;

background:#000;

color:white;

cursor:pointer;

}


.info{

margin-top:35px;

text-align:left;

line-height:2.2;

}


.box{

background:white;

padding:25px;

border-radius:20px;

margin-top:25px;

}


.key{

font-family:monospace;

font-size:18px;

font-weight:600;

}


.label{

color:#666;

}


</style>


</head>


<body>


<div class="card">


<h1>
ORION License Center
</h1>


<div class="subtitle">
Manage your ORION product authorization
</div>


<input
id="key"
placeholder="ORN-XXXX-XXXX-XXXX">


<br>


<button onclick="checkLicense()">
Check License
</button>


<div id="result"></div>


</div>



<script>


function checkLicense(){


const key =
document.getElementById("key").value.trim();


const result =
document.getElementById("result");


if(!key){

result.innerHTML="Please enter license key";

return;

}


result.innerHTML="Checking...";



fetch("/api/public/license/"+key)


.then(res=>res.json())


.then(data=>{


if(data.success){


const l=data.license;


result.innerHTML=`


<div class="box">


<div class="key">
${l.license_key}
</div>


<div class="info">


<p>
<span class="label">
Product:
</span>

${l.product}

</p>


<p>
<span class="label">
Status:
</span>

${l.status}

</p>


<p>
<span class="label">
Activation:
</span>

${l.activated_count}/${l.activation_limit}

</p>


<p>
<span class="label">
Device:
</span>

${l.device_id || "Not Activated"}

</p>


<p>
<span class="label">
Created:
</span>

${l.created_at}

</p>


</div>


</div>


`;



}else{


result.innerHTML="License Not Found";


}


})


.catch(()=>{


result.innerHTML="Server Error";


});


}



</script>


</body>

</html>
