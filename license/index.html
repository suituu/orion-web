<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORION License Center</title>


<style>

body{

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
"Microsoft YaHei",
sans-serif;

text-align:center;

margin:0;

padding:0;

color:#1d1d1f;

}


.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 10%;
background:rgba(255,255,255,.82);
border-bottom:1px solid rgba(0,0,0,.06);
backdrop-filter:blur(20px);
text-align:left;
}

.nav-logo{
color:#1d1d1f;
font-size:24px;
font-weight:700;
text-decoration:none;
}

.nav-links{
display:flex;
align-items:center;
gap:26px;
}

.nav-links a{
color:#333;
font-size:14px;
text-decoration:none;
}

.nav-links a:hover{
color:#0071e3;
}

.page{
padding:80px 20px;
}

@media (max-width:640px){
.nav{
padding:16px 20px;
}

.nav-links{
gap:14px;
}

.nav-links a:nth-child(2),
.nav-links a:nth-child(3){
display:none;
}
}


.card{

max-width:520px;

margin:auto;

background:#f5f5f7;

padding:45px;

border-radius:28px;

}


h1{

font-size:38px;

}


.subtitle{

color:#666;

margin-bottom:35px;

}


input{

width:90%;

padding:15px;

border-radius:20px;

border:1px solid #ccc;

font-size:16px;

}


button{

margin-top:20px;

padding:14px 45px;

border:0;

border-radius:30px;

background:#000;

color:white;

cursor:pointer;

}


.info{

margin-top:35px;

text-align:left;

line-height:2.2;

}


.box{

background:white;

padding:25px;

border-radius:20px;

margin-top:25px;

}


.key{

font-family:monospace;

font-size:18px;

font-weight:600;

}


.label{

color:#666;

}


</style>


</head>


<body>

<div class="nav">
<a class="nav-logo" href="/">ORION</a>

<div class="nav-links">
<a href="/">首页</a>
<a href="/products/">产品</a>
<a href="/buy/">购买</a>
<a href="/account/">用户中心</a>
</div>
</div>

<main class="page">


<div class="card">


<h1>
ORION License Center
</h1>


<div class="subtitle">
Manage your ORION product authorization
</div>


<input
id="key"
placeholder="ORN-XXXX-XXXX-XXXX">


<br>


<button onclick="checkLicense()">
Check License
</button>


<div id="result"></div>


</div>

</main>

<script>


function checkLicense(){


const key =
document.getElementById("key").value.trim();


const result =
document.getElementById("result");


if(!key){

result.innerHTML="Please enter license key";

return;

}


result.innerHTML="Checking...";



fetch("/api/public/license/"+key)


.then(res=>res.json())


.then(data=>{


if(data.success){


const l=data.license;


result.innerHTML=`


<div class="box">


<div class="key">
${l.license_key}
</div>


<div class="info">


<p>
<span class="label">
Product:
</span>

${l.product}

</p>


<p>
<span class="label">
Status:
</span>

${l.status}

</p>


<p>
<span class="label">
Activation:
</span>

${l.activated_count}/${l.activation_limit}

</p>


<p>
<span class="label">
Device:
</span>

${l.device_id || "Not Activated"}

</p>


<p>
<span class="label">
Created:
</span>

${l.created_at}

</p>


</div>


</div>


`;



}else{


result.innerHTML="License Not Found";


}


})


.catch(()=>{


result.innerHTML="Server Error";


});


}



</script>


</body>

</html>
